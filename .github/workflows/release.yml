name: "Release binaries"

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  build:
    name: "Build ${{ matrix.asset }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: "read"
      id-token: "write"
      attestations: "write"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-latest"
            asset: "cgate-windows-amd64.exe"
          - os: "macos-latest"
            asset: "cgate-macos-arm64"
          - os: "ubuntu-latest"
            asset: "cgate-linux-x86_64"
    env:
      UV_CACHE_DIR: "${{ github.workspace }}/.uv-cache"
    steps:
      - name: "Check out source"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - name: "Set up Python"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Cache uv packages"
        uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830" # v4.3.0
        with:
          path: "${{ env.UV_CACHE_DIR }}"
          key: >-
            uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: >-
            uv-${{ runner.os }}-${{ runner.arch }}-
      - name: "Install build tools"
        run: "python -m pip install 'uv>=0.8' 'pyinstaller==6.*'"
      - name: "Install project dependencies"
        run: "uv sync --extra dev"
      - name: "Build binary"
        run: "uv run python scripts/build-binary.py"
      - name: "Attest build provenance"
        uses: "actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be" # v2.4.0
        with:
          subject-path: "dist/${{ matrix.asset }}"
      - name: "Upload binary artifact"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
        with:
          name: "${{ matrix.asset }}"
          path: "dist/${{ matrix.asset }}"
          if-no-files-found: "error"

  release:
    name: "Publish GitHub Release"
    needs: "build"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Download binary artifacts"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093" # v4.3.0
        with:
          path: "."
          merge-multiple: true
      - name: "Create GitHub Release"
        uses: "softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65" # v2.6.2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "cgate ${{ github.ref_name }}"
          body: "Auto-generated release for ${{ github.ref_name }}."
          files: |
            cgate-windows-amd64.exe
            cgate-macos-arm64
            cgate-linux-x86_64
          fail_on_unmatched_files: true
